name: agent-rvv-encrypted-relay

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/agent-rvv-encrypted-relay.yml

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download encrypted private-repository review clone
        shell: bash
        run: |
          set -euo pipefail
          url='https://release-assets.githubusercontent.com/github-production-release-asset/1330112647/d9049a4e-a2f4-4cb2-abca-67a9e7ca00be?sp=r&sv=2018-11-09&sr=b&spr=https&se=2026-08-12T08%3A08%3A36Z&rscd=attachment%3B+filename%3Deducational-rvv-review-clone.tar.gz.gpg&rsct=application%2Foctet-stream&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skt=2026-08-12T07%3A08%3A02Z&ske=2026-08-12T08%3A08%3A36Z&sks=b&skv=2018-11-09&sig=8aTIoNmpRCqEKljLg5EFdVu9WgaNBiUurfkNQRybpKg%3D&jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmVsZWFzZWFzc2V0cHJvZHVjdGlvbi5ibG9iLmNvcmUud2luZG93cy5uZXQifQ.QsAhHAdW1NmNYrHgfMJBQI1HZ7fzobMaSrUXTpqKooU&response-content-disposition=attachment%3B%20filename%3Deducational-rvv-review-clone.tar.gz.gpg&response-content-type=application%2Foctet-stream'
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/educational-rvv-review-clone.tar.gz.gpg" \
            "$url"
          test -s "$RUNNER_TEMP/educational-rvv-review-clone.tar.gz.gpg"
          printf '%s  %s\n' \
            '19e421213586edb3d7c08d572b765e6166f0600f872ff7a456c5d3f8cdc2bc65' \
            "$RUNNER_TEMP/educational-rvv-review-clone.tar.gz.gpg" \
            | sha256sum -c -

      - name: Publish temporary public ciphertext release
        shell: bash
        run: |
          set -euo pipefail
          tag='agent-rvv-review-relay-31574132490'
          gh release delete "$tag" \
            --repo "$GITHUB_REPOSITORY" --cleanup-tag -y 2>/dev/null || true
          gh release create "$tag" \
            "$RUNNER_TEMP/educational-rvv-review-clone.tar.gz.gpg#educational-rvv-review-clone.tar.gz.gpg" \
            --repo "$GITHUB_REPOSITORY" \
            --title 'Temporary encrypted RVV review clone relay' \
            --notes 'Ciphertext only. The decryption key remains in the private repository and this release is removed after review.'
